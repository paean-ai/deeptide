<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Canvas Match-3 Puzzle</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="title-row">
        <h1 data-i18n="title">MATCH-3 PUZZLE</h1>
        <button id="lang-toggle" type="button">中文</button>
      </div>
      <div class="stats">
        <span><i data-i18n="level">Level</i> <b id="level">1</b></span>
        <span><i data-i18n="score">Score</i> <b id="score">0</b></span>
        <span><i data-i18n="best">Best</i> <b id="best">0</b></span>
        <span><i data-i18n="moves">Moves</i> <b id="moves">30</b></span>
        <span><i data-i18n="target">Target</i> <b id="target">0</b></span>
        <span><i data-i18n="combo">Combo</i> <b id="combo">x1</b></span>
      </div>
    </header>
    <canvas id="game" width="640" height="640"></canvas>
    <footer>
      <button id="shuffle" data-i18n="shuffle">Shuffle</button>
      <button id="restart" data-i18n="restart">Restart</button>
    </footer>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
