<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Three Product Configurator</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <canvas id="scene"></canvas>
    <section class="hud">
      <h1>AURORA POD</h1>
      <p>Interactive product stage · drag to rotate · choose a finish</p>
    </section>
    <section class="controls">
      <button data-finish="obsidian" class="active">Obsidian</button>
      <button data-finish="pearl">Pearl</button>
      <button data-finish="copper">Copper</button>
      <button data-finish="ice">Ice</button>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
