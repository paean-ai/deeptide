<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Canvas Tower Defense</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="960" height="540"></canvas>
    <section class="hud">
      <b data-i18n="title">TOWER DEFENSE</b>
      <span><i data-i18n="gold">Gold</i> <strong id="gold">120</strong></span>
      <span><i data-i18n="lives">Lives</i> <strong id="lives">20</strong></span>
      <span><i data-i18n="wave">Wave</i> <strong id="wave">1</strong></span>
      <span><i data-i18n="score">Score</i> <strong id="score">0</strong></span>
      <span><i data-i18n="best">Best</i> <strong id="best">0</strong></span>
      <span><i data-i18n="towerLabel">Tower</i> <strong id="tower-type">Arrow</strong></span>
      <button id="start" data-i18n="startWave">Start Wave</button>
      <button id="lang-toggle" type="button">中文</button>
    </section>
    <section class="tower-menu">
      <button class="active" data-tower="arrow"><i data-i18n="tName_arrow">Arrow</i> <small>55g</small></button>
      <button data-tower="cannon"><i data-i18n="tName_cannon">Cannon</i> <small>85g</small></button>
      <button data-tower="frost"><i data-i18n="tName_frost">Frost</i> <small>75g</small></button>
      <button id="upgrade" data-i18n="upgrade">Upgrade</button>
      <button id="sell" data-i18n="sell">Sell</button>
    </section>
    <section id="log" class="log"></section>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
