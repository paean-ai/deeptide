<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixel Fishing Idle</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="900" height="620"></canvas>
    <section id="hud">
      <b>PIXEL FISHING</b>
      <span>Coins <strong id="coins">0</strong></span>
      <span>Rod <strong id="rod">1</strong></span>
      <span>Bait <strong id="bait">1</strong></span>
      <span>Boat <strong id="boat">1</strong></span>
      <span>Zone <strong id="zone">Cove</strong></span>
      <span>Order <strong id="order">-</strong></span>
    </section>
    <section id="controls">
      <button id="cast" type="button">Cast Line</button>
      <button id="rod-up" type="button">Rod</button>
      <button id="bait-up" type="button">Bait</button>
      <button id="boat-up" type="button">Boat</button>
      <button id="zone-next" type="button">Sail</button>
      <button id="crew-up" type="button">Crew</button>
    </section>
    <section id="book"></section>
    <section id="log"></section>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
