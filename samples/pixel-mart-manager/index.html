<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Mart Manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="960" height="540"></canvas>
    <button id="lang-toggle" type="button">中文</button>
    <section id="hud">
      <b data-i18n="title">PIXEL MART</b>
      <span><i data-i18n="coins">Coins</i> <strong id="coins">0</strong></span>
      <span><i data-i18n="stock">Stock</i> <strong id="stock">0/6</strong></span>
      <span><i data-i18n="shelf">Shelf</i> <strong id="shelf">0</strong></span>
      <span><i data-i18n="rep">Rep</i> <strong id="rep">1</strong></span>
    </section>
    <section id="panel">
      <button id="upgrade-shelf" type="button">Upgrade Shelf</button>
      <button id="hire-helper" type="button">Hire Helper</button>
      <button id="expand-mart" type="button">Expand Mart</button>
      <button id="upgrade-marketing" type="button">Marketing</button>
    </section>
    <section id="touch">
      <div>
        <button data-dir="up" type="button" aria-label="Move up">▲</button>
        <button data-dir="left" type="button" aria-label="Move left">◀</button>
        <button data-dir="down" type="button" aria-label="Move down">▼</button>
        <button data-dir="right" type="button" aria-label="Move right">▶</button>
      </div>
      <button id="action" type="button" aria-label="Interact">ACT</button>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
