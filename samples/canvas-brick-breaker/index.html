<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Canvas Brick Breaker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="shell">
    <canvas id="game" width="960" height="540"></canvas>
    <section class="hud">
      <b data-i18n="title">BRICK BREAKER</b>
      <span><i data-i18n="score">Score</i> <strong id="score">0</strong></span>
      <span><i data-i18n="stage">Stage</i> <strong id="stage">1</strong></span>
      <span><i data-i18n="balls">Balls</i> <strong id="lives">3</strong></span>
      <span><i data-i18n="best">Best</i> <strong id="best">0</strong></span>
      <button id="restart" data-i18n="restart">Restart</button>
      <button id="lang-toggle" type="button">中文</button>
    </section>
    <p class="hint" data-i18n="hint">Move mouse or drag · Space launches · collect W/M/L/S power cores</p>
  </main>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
