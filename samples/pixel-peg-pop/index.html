<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Peg Pop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shell">
  <canvas id="game"></canvas>
  <button id="lang-toggle">中文</button>

  <!-- Title -->
  <div id="screen-title" class="screen">
    <h1 data-i18n="title">PEG POP</h1>
    <p data-i18n="subtitle">Aim, drop, and bounce. Pop every orange peg.</p>
    <p data-i18n="howto">Drag to aim the launcher, release to fire. The ball ricochets through the pegs — clear all the orange ones to win.</p>
    <div class="row">
      <button id="btn-play" data-i18n="play">PLAY</button>
      <button id="btn-levels" class="ghost" data-i18n="levelSelect">LEVELS</button>
    </div>
  </div>

  <!-- Level select -->
  <div id="screen-levels" class="screen hidden">
    <h2 data-i18n="levelSelect">LEVELS</h2>
    <div id="level-grid"></div>
    <button id="btn-levels-back" class="ghost" data-i18n="menu">MENU</button>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span id="hud-level">LEVEL 1</span>
      <span id="hud-orange">ORANGE 0</span>
      <span id="hud-balls">●●●</span>
    </div>
    <div class="controls">
      <button id="btn-game-menu" class="ctrl ghost" data-i18n="menu">MENU</button>
    </div>
  </div>

  <!-- Win -->
  <div id="overlay-win" class="overlay hidden">
    <h2 id="win-title" data-i18n="win">LEVEL CLEAR!</h2>
    <div id="win-stars" class="stars">★★★</div>
    <p id="win-line"></p>
    <div class="row">
      <button id="btn-next" data-i18n="next">NEXT</button>
      <button id="btn-retry" class="ghost" data-i18n="retry">RETRY</button>
      <button id="btn-win-levels" class="ghost" data-i18n="levelSelect">LEVELS</button>
    </div>
  </div>

  <!-- Lose -->
  <div id="overlay-lose" class="overlay hidden">
    <h2 data-i18n="lose">OUT OF BALLS</h2>
    <p data-i18n="loseMsg">Some orange pegs are still standing. Try again.</p>
    <div class="row">
      <button id="btn-lose-retry" data-i18n="retry">RETRY</button>
      <button id="btn-lose-levels" class="ghost" data-i18n="levelSelect">LEVELS</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
