<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Deep Miner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Title -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <h1 data-i18n="title">DEEP MINER</h1>
      <p class="tagline" data-i18n="subtitle">Dig for ore, dodge the lava, surface to bank it.</p>
      <button id="btn-play" class="big-btn" data-i18n="play">START DIGGING</button>
      <button id="btn-resume" class="ghost-btn hidden" data-i18n="resume">CONTINUE</button>
      <p class="howto" data-i18n="howto">Arrows / WASD or swipe. Dig down — fly up to sell.</p>
      <p id="title-best" class="best">Record depth: 0 m</p>
      <button id="lang-toggle" class="lang-toggle">中文</button>
    </div>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen hidden">
    <header id="hud">
      <div class="hud-top">
        <span id="hud-depth" class="tag">Depth 0m</span>
        <span id="hud-cash" class="tag gold">◆ 0</span>
        <button id="btn-shop" class="icon-btn" data-i18n="shop">SHOP</button>
        <button id="btn-pause" class="icon-btn">⏸</button>
      </div>
      <div class="bar-row">
        <span class="bar-label" data-i18n="fuel">Fuel</span>
        <div class="bar"><div id="fuel-fill"></div></div>
      </div>
      <div class="bar-row">
        <span class="bar-label" data-i18n="hull">Hull</span>
        <div class="bar"><div id="hull-fill"></div></div>
      </div>
      <div class="hud-bottom">
        <span id="cargo-text" class="tag">Cargo 0/12</span>
        <span id="log-line" class="log"></span>
      </div>
    </header>

    <div id="stage">
      <canvas id="game"></canvas>
    </div>

    <div id="dpad">
      <button id="btn-up" class="pad" aria-label="Fly up">▲</button>
      <button id="btn-left" class="pad" aria-label="Dig left">◀</button>
      <button id="btn-down" class="pad" aria-label="Dig down">▼</button>
      <button id="btn-right" class="pad" aria-label="Dig right">▶</button>
    </div>

    <!-- Pause -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="paused">PAUSED</h2>
        <button id="btn-pause-close" class="big-btn" data-i18n="leave">Resume</button>
        <button id="btn-pause-restart" class="ghost-btn" data-i18n="restart">New Miner</button>
        <button id="btn-pause-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>

    <!-- Shop -->
    <div id="overlay-shop" class="overlay hidden">
      <div class="panel shop-panel">
        <h2 data-i18n="shop">SHOP</h2>
        <p class="tip" data-i18n="tip">Surface refuels &amp; repairs free.</p>
        <div id="shop-cargo" class="shop-cargo"></div>
        <div class="shop-sellrow">
          <button id="btn-sell" class="big-btn" data-i18n="sellAll">Sell All</button>
          <span id="shop-cash" class="shop-cash">◆ 0</span>
        </div>
        <div id="shop-upgrades"></div>
        <button id="btn-shop-close" class="ghost-btn" data-i18n="close">Back to Surface</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="overlay-over" class="overlay hidden">
      <div class="panel">
        <h2 class="lose" data-i18n="gameOver">RIG LOST</h2>
        <p id="over-cause" class="panel-msg">Out of fuel.</p>
        <p id="over-depth" class="panel-msg">Deepest dig: 0 m.</p>
        <p id="over-best" class="best">Record depth: 0 m</p>
        <button id="btn-over-again" class="big-btn" data-i18n="again">NEW MINER</button>
        <button id="btn-over-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>
  </section>

</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
