<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Orb Fusion</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Title -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <h1 data-i18n="title">ORB FUSION</h1>
      <p class="tagline" data-i18n="subtitle">Slide the orbs. Fuse them. Reach 2048.</p>
      <button id="btn-play" class="big-btn" data-i18n="play">PLAY</button>
      <p class="howto" data-i18n="howto">Arrows / WASD or swipe to slide every orb. Equal orbs fuse.</p>
      <p id="title-best" class="best">Best: 0</p>
      <button id="lang-toggle" class="lang-toggle">中文</button>
    </div>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen hidden">
    <header id="hud">
      <span class="tag score"><i data-i18n="score">Score</i> <b id="hud-score">0</b></span>
      <button id="btn-undo" class="hbtn" data-i18n="undo">Undo</button>
      <button id="btn-restart" class="hbtn" data-i18n="restart">New</button>
      <button id="btn-pause" class="icon-btn">⏸</button>
    </header>

    <div id="stage"><canvas id="game"></canvas></div>

    <div id="dpad">
      <button id="btn-up" class="pad" aria-label="Up">▲</button>
      <button id="btn-left" class="pad" aria-label="Left">◀</button>
      <button id="btn-down" class="pad" aria-label="Down">▼</button>
      <button id="btn-right" class="pad" aria-label="Right">▶</button>
    </div>

    <!-- Pause -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="paused">PAUSED</h2>
        <button id="btn-pause-resume" class="big-btn" data-i18n="resume">Resume</button>
        <button id="btn-pause-restart" class="ghost-btn" data-i18n="restart">New</button>
        <button id="btn-pause-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>

    <!-- 2048 reached -->
    <div id="overlay-win" class="overlay hidden">
      <div class="panel">
        <h2 class="win" data-i18n="reached2048">THE 2048 ORB!</h2>
        <p id="result-msg" class="panel-msg">You forged the 2048 orb.</p>
        <button id="btn-win-continue" class="big-btn" data-i18n="keepGoing">KEEP FUSING</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="overlay-over" class="overlay hidden">
      <div class="panel">
        <h2 class="lose" data-i18n="gameOver">GRID LOCKED</h2>
        <p id="over-score" class="panel-msg">Score: 0</p>
        <p id="over-best" class="best">Best: 0</p>
        <button id="btn-over-again" class="big-btn" data-i18n="again">TRY AGAIN</button>
        <button id="btn-over-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>
  </section>

</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
