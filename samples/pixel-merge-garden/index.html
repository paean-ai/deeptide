<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixel Merge Garden</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>MERGE GARDEN</h1>
      <div class="stats">
        <span>Coins <b id="coins">20</b></span>
        <span>Bank <b id="bank">0</b></span>
        <span>Best Crop <b id="best">1</b></span>
        <span>Income <b id="income">0/s</b></span>
        <span>Order <b id="order">-</b></span>
      </div>
    </header>
    <section id="board"></section>
    <footer>
      <button id="buy" type="button">Buy Seed (10)</button>
      <button id="collect" type="button">Collect</button>
      <button id="water" type="button">Water All</button>
      <button id="reset" type="button">Reset</button>
    </footer>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
