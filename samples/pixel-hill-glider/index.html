<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Hill Glider</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shell">
  <canvas id="game"></canvas>
  <button id="lang-toggle">中文</button>

  <!-- Title -->
  <div id="screen-title" class="screen">
    <h1 data-i18n="title">HILL GLIDER</h1>
    <p data-i18n="subtitle">Dive the downhills, soar off the crests.</p>
    <p data-i18n="howto">Hold anywhere (or Space) to tuck and dive. Release to glide. Catch light orbs before dusk falls.</p>
    <button id="btn-play" data-i18n="play">GLIDE</button>
    <p id="title-best"></p>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span id="hud-dist">DIST 0</span>
      <span id="hud-best">BEST 0</span>
    </div>
  </div>

  <!-- Game over -->
  <div id="screen-over" class="screen hidden">
    <h2 data-i18n="gameOver">DUSK FELL</h2>
    <p id="final-dist"></p>
    <p id="final-orbs"></p>
    <p id="final-best"></p>
    <div class="row">
      <button id="btn-again" data-i18n="again">GLIDE AGAIN</button>
      <button id="btn-menu" class="ghost" data-i18n="menu">MENU</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
