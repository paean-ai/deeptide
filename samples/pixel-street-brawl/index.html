<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pixel Street Brawl</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Title -->
  <section id="screen-title" class="screen">
    <div class="title-box">
      <h1 data-i18n="title">STREET BRAWL</h1>
      <p class="tagline" data-i18n="subtitle">Punch, kick, and combo through the horde.</p>
      <button id="btn-play" class="big-btn" data-i18n="play">FIGHT</button>
      <p class="howto" data-i18n="howto">Move with arrows / A·D. J punch, K kick, L jump.</p>
      <p id="title-best" class="best">Best: 0</p>
      <button id="lang-toggle" class="lang-toggle">中文</button>
    </div>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen hidden">
    <header id="hud">
      <span id="hud-wave" class="tag">Wave 1</span>
      <div id="hp-bar"><div id="hp-fill"></div></div>
      <span id="hud-score" class="tag score">0</span>
      <button id="btn-pause" class="icon-btn">⏸</button>
    </header>

    <div id="stage"><canvas id="game"></canvas></div>

    <div id="controls">
      <div id="move-pad">
        <button id="btn-left" class="pad" aria-label="Left">◀</button>
        <button id="btn-right" class="pad" aria-label="Right">▶</button>
      </div>
      <div id="act-pad">
        <button id="btn-punch" class="act" data-i18n="punch">PUNCH</button>
        <button id="btn-kick" class="act" data-i18n="kick">KICK</button>
        <button id="btn-jump" class="act" data-i18n="jump">JUMP</button>
      </div>
    </div>

    <!-- Pause -->
    <div id="overlay-pause" class="overlay hidden">
      <div class="panel">
        <h2 data-i18n="paused">PAUSED</h2>
        <button id="btn-pause-resume" class="big-btn" data-i18n="resume">Resume</button>
        <button id="btn-pause-restart" class="ghost-btn" data-i18n="restart">Restart</button>
        <button id="btn-pause-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>

    <!-- Game over -->
    <div id="overlay-over" class="overlay hidden">
      <div class="panel">
        <h2 class="lose" data-i18n="gameOver">KNOCKED OUT</h2>
        <p id="over-score" class="panel-msg">Score: 0</p>
        <p id="over-wave" class="panel-msg">Reached wave 1</p>
        <p id="over-best" class="best">Best: 0</p>
        <button id="btn-over-again" class="big-btn" data-i18n="again">BRAWL AGAIN</button>
        <button id="btn-over-menu" class="ghost-btn" data-i18n="menu">Menu</button>
      </div>
    </div>
  </section>

</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
