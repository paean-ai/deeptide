<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Solitaire</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="shell">
  <canvas id="game"></canvas>
  <button id="lang-toggle">中文</button>

  <!-- Title -->
  <div id="screen-title" class="screen">
    <h1 data-i18n="title">SOLITAIRE</h1>
    <p data-i18n="subtitle">Klondike patience, one tap at a time.</p>
    <p data-i18n="howto">Tap a card to send it to its best spot. Tap the deck to draw. Build the four foundations from Ace to King.</p>
    <button id="btn-play" data-i18n="play">DEAL</button>
    <p id="title-stats"></p>
  </div>

  <!-- Game -->
  <div id="screen-game" class="screen hidden">
    <div class="hud">
      <span id="hud-time">0:00</span>
      <span id="hud-moves">MOVES 0</span>
    </div>
    <div class="controls">
      <button id="btn-undo" class="ctrl">UNDO</button>
      <button id="btn-new" class="ctrl">NEW</button>
      <button id="btn-menu" class="ctrl ghost" data-i18n="menu">MENU</button>
    </div>
  </div>

  <!-- Win -->
  <div id="overlay-win" class="overlay hidden">
    <h2 data-i18n="won">YOU WIN!</h2>
    <p id="win-line"></p>
    <div class="row">
      <button id="btn-again" data-i18n="again">NEW DEAL</button>
      <button id="btn-win-menu" class="ghost" data-i18n="menu">MENU</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
