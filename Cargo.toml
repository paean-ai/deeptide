[workspace]
members = [
    "crates/deeptide-cli",
    "crates/deeptide-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/paean-ai/deeptide"
homepage = "https://github.com/paean-ai/deeptide"
authors = ["Paean AI"]

[workspace.dependencies]
clap = { version = "4.5.40", features = ["derive", "env"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
regex = "1.12.2"
rustyline = "18"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
terminal_size = "0.4.3"
thiserror = "2.0.12"
# `unicode-width` ships an EAW-aware width table that's the de-facto Rust
# crate. We pin to 0.2 (latest as of 2026-05) which fixes the EAW=W
# classification of recent CJK extensions and adds VS-15/VS-16 awareness.
# rustyline 14 transitively pulls in 0.1 — we add a direct dep so our own
# wrapping/truncation/status-bar code agrees with what the terminal will
# actually render.
unicode-width = "0.2"
time = { version = "0.3.41", features = ["formatting"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
